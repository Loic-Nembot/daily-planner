<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1> Tagesplan </h1>

    <button type="button" id="mentorbtn">Mentor</button>
    <button type="button" id="menteebtn">Betreute/r</button>
    <div id="taskForm">
        <input type="time" id="startInput">
        <input type="time" id="endInput">
        <input type="text" id="nameInput" placeholder="Task name">
        <input type="text" id="descInput" placeholder="Description (optional)">
        <button type="button" id="saveBtn">Add task</button>
        <button type="button" id="cancelBtn">Cancel</button>
    </div>
    <div id="app"></div>
    <script src="js/app.js" defer></script>
</body>
</html>
